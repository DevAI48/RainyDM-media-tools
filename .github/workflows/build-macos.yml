# Builds FFmpeg (LGPL, with libmp3lame) for macOS Intel and Apple silicon, because BtbN has no macOS
# builds, and publishes them to a release in RainyDM's layout.
name: Build macOS LGPL builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in this repository, e.g. ffmpeg-8.1
        required: true
        default: ffmpeg-8.1

permissions:
  contents: write

env:
  FFMPEG_VERSION: "8.1"
  # Pinned sources: update the tag and its commit together, in a reviewed change
  # (git ls-remote --tags https://github.com/FFmpeg/FFmpeg 'refs/tags/n8.1*', the ^{} line).
  FFMPEG_GIT: https://github.com/FFmpeg/FFmpeg.git
  FFMPEG_TAG: n8.1.3
  FFMPEG_COMMIT: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
  LAME_URL: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
  LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e

jobs:
  build:
    strategy:
      matrix:
        include:
          - { rid: osx-x64, runner: macos-15-intel }
          - { rid: osx-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0" # RainyDM's macOS minimum
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and check the pinned sources
        run: |
          git init -q ffmpeg
          git -C ffmpeg fetch -q --depth 1 "$FFMPEG_GIT" "refs/tags/$FFMPEG_TAG"
          git -C ffmpeg checkout -q FETCH_HEAD
          actual=$(git -C ffmpeg rev-parse HEAD)
          [ "$actual" = "$FFMPEG_COMMIT" ] \
            || { echo "::error::$FFMPEG_TAG is $actual, expected $FFMPEG_COMMIT"; exit 1; }
          curl -fsSL "$LAME_URL" -o lame.tar.gz
          echo "$LAME_SHA256  lame.tar.gz" | shasum -a 256 -c

      - name: Build LAME (static, LGPL)
        run: |
          brew install nasm pkg-config
          mkdir lame && tar -xzf lame.tar.gz -C lame --strip-components=1
          cd lame
          ./configure --prefix="$GITHUB_WORKSPACE/deps" --disable-shared --enable-static --disable-frontend
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build FFmpeg (LGPL)
        run: |
          cd ffmpeg
          ./configure --prefix="$GITHUB_WORKSPACE/out-ffmpeg" \
            --disable-gpl --disable-nonfree --disable-debug --disable-doc --disable-ffplay --disable-ffprobe \
            --enable-static --disable-shared --enable-libmp3lame \
            --extra-cflags="-I$GITHUB_WORKSPACE/deps/include" --extra-ldflags="-L$GITHUB_WORKSPACE/deps/lib"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Check the build
        run: |
          bin=out-ffmpeg/bin/ffmpeg
          $bin -hide_banner -encoders | grep -q libmp3lame || { echo "::error::libmp3lame missing"; exit 1; }
          $bin -hide_banner -buildconf | tee buildconf.txt
          if grep -q -- '--enable-gpl' buildconf.txt; then echo "::error::GPL build"; exit 1; fi
          otool -L $bin

      - name: Package
        run: |
          stage=$(mktemp -d); mkdir -p "$stage/bin" out
          cp out-ffmpeg/bin/ffmpeg "$stage/bin/ffmpeg"
          cp LICENSES/LGPL-2.1.txt "$stage/LICENSE"
          { echo "FFmpeg $FFMPEG_TAG (LGPL) with LAME 3.100, built for ${{ matrix.rid }}"; echo; cat buildconf.txt; } > "$stage/BUILDINFO.txt"
          printf 'FFmpeg source: %s tag %s (commit %s)\nLAME source: %s\n' "$FFMPEG_GIT" "$FFMPEG_TAG" "$FFMPEG_COMMIT" "$LAME_URL" > "$stage/SOURCE.txt"
          name="ffmpeg-${FFMPEG_VERSION}-${{ matrix.rid }}-lgpl.tar.gz"
          tar -czf "out/$name" -C "$stage" .
          (cd out && shasum -a 256 "$name" > "checksums-${{ matrix.rid }}.txt" && cat "checksums-${{ matrix.rid }}.txt")

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" \
                 --notes "Pinned LGPL FFmpeg builds for RainyDM. Sources: see SOURCE.txt in each archive."
          gh release upload "${{ inputs.tag }}" out/* --clobber
